# Build matrix of ADR-001 and ADR-013: the core and CLI with GCC, Clang and
# TinyCC on Linux, Apple Clang on macOS, MSVC on Windows; the workbench
# typecheck, lint, build and smoke; the Python tools; catalog validation.
# Third-party actions pinned to tags until reviewed SHAs are recorded:
# ilammy/msvc-dev-cmd@v1, pnpm/action-setup@v4, actions/setup-node@v4.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  core:
    name: core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-24.04, preset: ci-gcc }
          - { name: linux-clang, os: ubuntu-24.04, preset: ci-clang }
          - { name: linux-tcc,   os: ubuntu-24.04, preset: ci-tcc }
          - { name: macos-clang, os: macos-14,     preset: ci-clang }
          - { name: windows-msvc, os: windows-2022, preset: ci-msvc }
          - { name: linux-asan,  os: ubuntu-24.04, preset: asan }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang tcc
      - name: Install firmware toolchains (the build test's GNU and clang profiles)
        if: matrix.name == 'linux-gcc'
        run: sudo apt-get install -y lld gcc-arm-none-eabi gcc-avr avr-libc gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
      - name: Run the examples headless
        run: python3 tools/ci/run_examples.py --build build/${{ matrix.preset }}
      - name: Arduino sketches on the unmodified ArduinoCore-avr
        if: matrix.name == 'linux-gcc'
        run: |
          git init -q "$RUNNER_TEMP/ArduinoCore-avr"
          git -C "$RUNNER_TEMP/ArduinoCore-avr" fetch -q --depth 1 https://github.com/arduino/ArduinoCore-avr.git 11b9130371e8447920edb65a75706a6c951e51fc
          git -C "$RUNNER_TEMP/ArduinoCore-avr" checkout -q FETCH_HEAD
          python3 tests/vendor/arduino/run.py --core "$RUNNER_TEMP/ArduinoCore-avr" --libs "$RUNNER_TEMP/arduino-libs" --fetch --embsim build/${{ matrix.preset }}/bin/embsim
      - name: STM32 HAL applications on the unmodified STM32F1 HAL
        if: matrix.name == 'linux-gcc'
        run: |
          fetch() { # directory, repository, commit[, sparse path]
            git init -q "$RUNNER_TEMP/st/$1"
            git -C "$RUNNER_TEMP/st/$1" fetch -q --depth 1 --filter=blob:none "$2" "$3"
            if [ -n "$4" ]; then git -C "$RUNNER_TEMP/st/$1" sparse-checkout set --no-cone "$4"; fi
            git -C "$RUNNER_TEMP/st/$1" checkout -q FETCH_HEAD
          }
          fetch stm32f1xx_hal_driver https://github.com/STMicroelectronics/stm32f1xx_hal_driver.git bd368aa335c529641d2e567574885e02deacc64a
          fetch cmsis_device_f1 https://github.com/STMicroelectronics/cmsis_device_f1.git c8e9a4a4f16b6d2cb2a2083cbe5161025280fb22
          fetch CMSIS_5 https://github.com/ARM-software/CMSIS_5.git 55b19837f5703e418ca37894d5745b1dc05e4c91 /CMSIS/Core/Include/
          python3 tests/vendor/stm32cube/run.py --st "$RUNNER_TEMP/st" --embsim build/${{ matrix.preset }}/bin/embsim
      - name: STM32CubeF4's examples on the NUCLEO-F446RE
        if: matrix.name == 'linux-gcc'
        # at the submodule commits CubeF4 pins; CMSIS_5's core headers are the STM32F1 step's checkout
        run: |
          fetch() { # directory, repository, commit[, sparse path]
            git init -q "$RUNNER_TEMP/st/$1"
            git -C "$RUNNER_TEMP/st/$1" fetch -q --depth 1 --filter=blob:none "$2" "$3"
            if [ -n "$4" ]; then git -C "$RUNNER_TEMP/st/$1" sparse-checkout set "$4"; fi
            git -C "$RUNNER_TEMP/st/$1" checkout -q FETCH_HEAD
          }
          fetch cubef4 https://github.com/STMicroelectronics/STM32CubeF4.git 60c8abe0ae88a23bbd1c925358330031e36dd20f Projects/STM32446E-Nucleo
          fetch stm32f4xx_hal_driver https://github.com/STMicroelectronics/stm32f4xx_hal_driver.git 1f6451c3e07728b4c830744de380e56bf5bc0026
          fetch cmsis_device_f4 https://github.com/STMicroelectronics/cmsis_device_f4.git 9192c7b9df75a142f2027ab266601fe061fc00b3
          fetch stm32f4xx-nucleo-bsp https://github.com/STMicroelectronics/stm32f4xx-nucleo-bsp.git 84b99c762908ef56f711acf970ab13d4ec278df6
          python3 tests/vendor/stm32cubef4/run.py --st "$RUNNER_TEMP/st" --embsim build/${{ matrix.preset }}/bin/embsim
      - name: Pico SDK applications on the unmodified SDK
        if: matrix.name == 'linux-gcc'
        run: |
          git init -q "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" fetch -q --depth 1 https://github.com/raspberrypi/pico-sdk.git 079c6f39023649b154152db30f1d781e884879bc
          git -C "$RUNNER_TEMP/pico-sdk" checkout -q FETCH_HEAD
          python3 tests/vendor/pico-sdk/run.py --sdk "$RUNNER_TEMP/pico-sdk" --embsim build/${{ matrix.preset }}/bin/embsim
      - name: nrfx applications on Nordic's unmodified nrfx and MDK
        if: matrix.name == 'linux-gcc'
        # CMSIS_5's core headers are the STM32 step's checkout
        run: |
          git init -q "$RUNNER_TEMP/nrfx"
          git -C "$RUNNER_TEMP/nrfx" fetch -q --depth 1 --filter=blob:none https://github.com/NordicSemiconductor/nrfx.git d1f2c35a4820961f4f7b7b2ece007f8e037842db
          git -C "$RUNNER_TEMP/nrfx" sparse-checkout set --no-cone '/*.h' /drivers/ /hal/ /haly/ /helpers/ /lib/ /templates/ '/bsp/stable/*.h' /bsp/stable/soc/ /bsp/stable/templates/ '/bsp/stable/mdk/*.h' /bsp/stable/mdk/common/ /bsp/stable/mdk/nrf52/
          git -C "$RUNNER_TEMP/nrfx" checkout -q FETCH_HEAD
          python3 tests/vendor/nrfx/run.py --nrfx "$RUNNER_TEMP/nrfx" --cmsis "$RUNNER_TEMP/st/CMSIS_5" --embsim build/${{ matrix.preset }}/bin/embsim
      - name: SiFive's examples on the unmodified freedom-metal
        if: matrix.name == 'linux-gcc'
        run: |
          git init -q "$RUNNER_TEMP/freedom-e-sdk"
          git -C "$RUNNER_TEMP/freedom-e-sdk" fetch -q --depth 1 --filter=blob:none https://github.com/sifive/freedom-e-sdk.git 4518a22c213d7fec6e23e20d24a2ba646014f6dd
          git -C "$RUNNER_TEMP/freedom-e-sdk" sparse-checkout set bsp/sifive-hifive1-revb software
          git -C "$RUNNER_TEMP/freedom-e-sdk" checkout -q FETCH_HEAD
          git init -q "$RUNNER_TEMP/freedom-metal"
          git -C "$RUNNER_TEMP/freedom-metal" fetch -q --depth 1 https://github.com/sifive/freedom-metal.git 1cec4a23a7ed7350db79a392be65acd51acd5412
          git -C "$RUNNER_TEMP/freedom-metal" checkout -q FETCH_HEAD
          python3 tests/vendor/freedom-metal/run.py --sdk "$RUNNER_TEMP/freedom-e-sdk" --metal "$RUNNER_TEMP/freedom-metal" --embsim build/${{ matrix.preset }}/bin/embsim

  tools:
    name: tools and catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet jsonschema pyyaml
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: python3 tools/validate.py --all
      - name: The analog fixtures' ngspice references regenerate unchanged
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          python3 tools/analog/ngspice_fixture.py --check
      - name: The DSP and core tests' expected outputs are QEMU's Cortex-M4's
        run: |
          sudo apt-get install -y qemu-system-arm
          python3 tests/protocol/test_dsp.py --qemu
          python3 tests/protocol/test_cm4_core.py --qemu

  workbench:
    name: workbench
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm typecheck
        working-directory: ui
      - run: pnpm lint
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - run: pnpm test
        working-directory: ui

  smoke:
    # SPEC-011 §6.7: open, run, press, observe, export, on every platform
    name: workbench smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ui/apps/workbench
      - run: pnpm e2e
        working-directory: ui/apps/workbench
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workbench-smoke-${{ matrix.os }}
          path: ui/apps/workbench/test-results/
          if-no-files-found: ignore

  desktop:
    # the installers (ADR-008): the Tauri shell with the engine as its sidecar
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, bundles: 'deb,appimage' }
          - { os: macos-14, bundles: 'dmg' }
          - { os: windows-2022, bundles: 'msi' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Build the engine
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release
      - run: python3 desktop/prepare-sidecar.py
      - name: Build the installers
        if: runner.os != 'Windows'
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
        working-directory: desktop
      - name: Build the installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Git's coreutils `link` comes before MSVC's linker on the runner's
        # PATH; without it (and with VCINSTALLDIR unset) rustc finds Visual Studio
        run: |
          Remove-Item Env:VCINSTALLDIR -ErrorAction SilentlyContinue
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\usr\\bin' }) -join ';'
          npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: embsim-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  merge_gate:
    name: CI merge gate
    runs-on: ubuntu-24.04
    needs: [core, tools, workbench, smoke, desktop]
    if: always()
    steps:
      - name: Require every job to succeed
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          print(bad or "all jobs succeeded")
          sys.exit(1 if bad else 0)'
