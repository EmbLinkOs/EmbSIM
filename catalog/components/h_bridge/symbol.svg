<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100" data-grid="10">
  <style>.s{stroke:var(--symbol-stroke,#cdd6e4);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.f{stroke:var(--symbol-stroke,#cdd6e4);fill:var(--symbol-fill,#1b2230);stroke-width:1.5;stroke-linejoin:round}.t{fill:var(--symbol-stroke,#cdd6e4);font-family:sans-serif;font-size:7px}.p{fill:var(--symbol-stroke,#cdd6e4);font-family:sans-serif;font-size:5.5px}</style>
  <rect class="f" x="10" y="10" width="60" height="80" rx="2"/>
  <line class="s" id="pin-in1" x1="0" y1="20" x2="10" y2="20"/><text class="p" x="13" y="22">IN1</text>
  <line class="s" id="pin-in2" x1="0" y1="30" x2="10" y2="30"/><text class="p" x="13" y="32">IN2</text>
  <line class="s" id="pin-pwm" x1="0" y1="40" x2="10" y2="40"/><text class="p" x="13" y="42">PWM</text>
  <line class="s" id="pin-en" x1="0" y1="50" x2="10" y2="50"/><text class="p" x="13" y="52">EN</text>
  <line class="s" id="pin-fault" x1="0" y1="70" x2="10" y2="70"/><text class="p" x="13" y="72">FAULT</text>
  <line class="s" id="pin-out1" x1="80" y1="30" x2="70" y2="30"/><text class="p" x="67" y="32" text-anchor="end">OUT1</text>
  <line class="s" id="pin-out2" x1="80" y1="60" x2="70" y2="60"/><text class="p" x="67" y="62" text-anchor="end">OUT2</text>
  <line class="s" id="pin-vm" x1="40" y1="0" x2="40" y2="10"/><text class="p" x="40" y="17" text-anchor="middle">VM</text>
  <line class="s" id="pin-gnd" x1="30" y1="100" x2="30" y2="90"/><text class="p" x="30" y="87" text-anchor="middle">GND</text>
  <line class="s" id="pin-sen" x1="50" y1="100" x2="50" y2="90"/><text class="p" x="50" y="87" text-anchor="middle">SEN</text>
  <line class="s" id="pin-vcc" x1="60" y1="0" x2="60" y2="10"/><text class="p" x="60" y="17" text-anchor="middle">VCC</text>
  <text class="t" x="45" y="48" text-anchor="middle">H-bridge</text>
