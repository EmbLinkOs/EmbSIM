<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70" data-grid="10">
  <style>.s{stroke:var(--symbol-stroke,#cdd6e4);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.f{stroke:var(--symbol-stroke,#cdd6e4);fill:var(--symbol-fill,#1b2230);stroke-width:1.5;stroke-linejoin:round}.k{fill:var(--symbol-stroke,#cdd6e4);stroke:none}.t{fill:var(--symbol-stroke,#cdd6e4);font-family:sans-serif;font-size:7px}.p{fill:var(--symbol-stroke,#cdd6e4);font-family:sans-serif;font-size:5.5px}</style>
  <rect class="f" x="10" y="10" width="50" height="50" rx="2"/>
  <line class="s" id="pin-trig" x1="0" y1="20" x2="10" y2="20"/><text class="p" x="13" y="22">TRIG</text>
  <line class="s" id="pin-thr" x1="0" y1="30" x2="10" y2="30"/><text class="p" x="13" y="32">THR</text>
